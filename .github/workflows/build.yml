name: Manual diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Manual build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee out.log || { grep -E '✖|^not ok|AssertionError|error TS|# fail' out.log | head -48 | while read -r l; do echo "::error::$l"; done; exit 1; }

  engine:
    name: Manual engine suite
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Engine and contract suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:engine 2>&1 | tee out.log || { grep -E '✖|^not ok|AssertionError|error TS|# fail' out.log | head -48 | while read -r l; do echo "::error::$l"; done; exit 1; }
