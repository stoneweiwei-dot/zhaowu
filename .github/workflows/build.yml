name: website-build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build and typecheck
        run: npm run build
      - name: Locked engine acceptance vectors
        run: node scripts/engine-acceptance.test.mjs
      - name: Package verified deploy source
        uses: actions/upload-artifact@v4
        with:
          name: zhaowu-deploy-source
          path: |
            package.json
            package-lock.json
            index.html
            vite.config.ts
            tsconfig.json
            public
            scripts
            src
          if-no-files-found: error
          retention-days: 1
