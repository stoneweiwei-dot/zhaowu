name: Manual diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Manual build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || { grep -E 'not ok|error TS|AssertionError|Error:' build.log | head -40 | while read -r l; do echo "::error::$l"; done; grep -B2 -A14 '^not ok' build.log | head -120 | while read -r l; do echo "::warning::$l"; done; exit 1; }

  engine:
    name: Manual engine suite
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Engine and contract suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:engine 2>&1 | tee eng.log || { grep -E '^not ok|# fail' eng.log | head -40 | while read -r l; do echo "::error::$l"; done; exit 1; }
