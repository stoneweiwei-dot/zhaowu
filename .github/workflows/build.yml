name: Production CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck, build, and package
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Deterministic engine and contract tests
        run: npm run test:engine

      - name: TypeScript check
        run: npm run check

      - name: Production build
        run: npm exec vite build

      - name: Install Mobile Safari browser runtime
        run: ./node_modules/.bin/playwright install --with-deps webkit

      - name: iPhone Safari loading fallback regression
        run: npm run test:iphone-safari

      - name: Package verified deploy source
        uses: actions/upload-artifact@v4
        with:
          name: zhaowu-deploy-source
          path: |
            package.json
            package-lock.json
            index.html
            playwright.config.ts
            vite.config.ts
            tsconfig.json
            e2e
            public
            scripts
            src
          if-no-files-found: error
          retention-days: 1
