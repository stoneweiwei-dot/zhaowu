name: Manual diagnostics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Manual build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee out.log || { echo "::error::BUILDFAIL=$(grep -E '^✖|error TS|Error:' out.log | sed 's/ ([0-9.]*ms)$//' | sort -u | head -40 | tr '\n' '|')"; npx vite build >/dev/null 2>&1 || exit 1; echo "VITE_ONLY=1" >> $GITHUB_ENV; }


  engine:
    name: Manual engine suite
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Engine and contract suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:engine 2>&1 | tee out.log || { echo "::error::FAILS=$(grep -E '^✖' out.log | sed 's/ ([0-9.]*ms)$//' | sort -u | tr '\n' '|')"; exit 1; }
