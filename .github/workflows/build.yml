name: Manual diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Manual build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

  engine:
    name: Manual engine suite
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Engine and contract suite
        run: |
          set +e
          npm run test:engine > out.txt 2>&1
          code=$?
          grep -E "^\s*✖" out.txt | sort -u | head -60 | while IFS= read -r l; do echo "::warning::$l"; done
          grep -E "^ℹ (tests|pass|fail)" out.txt | while IFS= read -r l; do echo "::notice::$l"; done
          exit $code
