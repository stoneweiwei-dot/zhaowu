name: Visual audit (temporary)
on:
  push:
    branches: ["visual-audit/**"]
permissions:
  contents: write
concurrency:
  group: visual-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shots:
    if: "!contains(github.event.head_commit.message, '[shots]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: ./node_modules/.bin/playwright install --with-deps webkit chromium
      - run: mkdir -p visual-audit-shots
      - run: node scripts/visual-audit/shoot.mjs
        env:
          TARGETS: "prod=https://stone-zhaowu-official.vercel.app"
          ROUTES: "/"
          OUT_DIR: visual-audit-shots
      - run: |
          curl -s https://stone-zhaowu-official.vercel.app/ -o visual-audit-shots/prod.html
          CSS=$(grep -oE '/assets/[^"]+\.css' visual-audit-shots/prod.html | head -1)
          curl -s "https://stone-zhaowu-official.vercel.app$CSS" -o /tmp/prod.css
          { echo "css=$CSS"; grep -o 'home-install-title[^}]*}' /tmp/prod.css | head -3; grep -c 'zhaowu-home-sheet-shell main.zhaowu-home-layout' /tmp/prod.css; } > visual-audit-shots/prod-css-check.txt
      - name: Commit output back to branch
        run: |
          git config user.name "visual-audit-bot"
          git config user.email "visual-audit-bot@users.noreply.github.com"
          git add -f visual-audit-shots
          git commit -m "chore: visual audit output [shots] [skip ci]" || exit 0
          git push
