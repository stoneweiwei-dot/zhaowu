name: Visual audit (temporary)
on:
  push:
    branches: ["visual-audit/**"]
permissions:
  contents: write
concurrency:
  group: visual-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shots:
    if: "!contains(github.event.head_commit.message, '[shots]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: ./node_modules/.bin/playwright install --with-deps webkit chromium
      - run: npx vite build
      - run: (npx vite preview --host 127.0.0.1 --port 4173 &) && sleep 4
      - run: node scripts/visual-audit/shoot.mjs
        env:
          TARGETS: "local=http://127.0.0.1:4173"
          ROUTES: "/"
          OUT_DIR: visual-audit-shots
      - run: node scripts/visual-audit/dom.mjs
      - name: Commit screenshots back to branch
        run: |
          git config user.name "visual-audit-bot"
          git config user.email "visual-audit-bot@users.noreply.github.com"
          git add -f visual-audit-shots
          git commit -m "chore: visual audit screenshots [shots] [skip ci]" || exit 0
          git push
