name: ZVec Knowledge Smoke

on:
  pull_request:
    paths:
      - ".github/zvec-knowledge/**"
      - ".github/workflows/zvec-knowledge.yml"
  push:
    branches: [main]
    paths:
      - ".github/zvec-knowledge/**"
      - ".github/workflows/zvec-knowledge.yml"
  workflow_dispatch:
    inputs:
      query:
        description: "Optional CURRENT knowledge query"
        required: false
        default: "R6.2.2 CURRENT MASTER"

permissions:
  contents: read

jobs:
  zvec-smoke:
    name: ZVec reopen FTS smoke
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .github/zvec-knowledge/package-lock.json

      - name: Install isolated ZVec tool
        run: npm ci --prefix .github/zvec-knowledge --no-audit --no-fund

      - name: Verify build, optimize, close, reopen, search
        run: npm run --prefix .github/zvec-knowledge smoke

      - name: Manual query
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          ZVEC_QUERY: ${{ inputs.query }}
        run: |
          npm run --prefix .github/zvec-knowledge build-index
          npm run --prefix .github/zvec-knowledge search -- "$ZVEC_QUERY"
