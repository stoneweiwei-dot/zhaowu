name: Branch cleanup (one-time)

# One-time manual workflow (owner clicks "Run workflow"). Deletes stale remote
# branches already classified as merged / squash-merged / abandoned in the r220
# cleanup pass. Missing branches are ignored. main and branches behind open PRs
# (design/r222-home-surface, song-handscroll-six-frames-r220) and
# visual-audit/r222 are NOT in the list. Delete this file after running.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to confirm'
        required: true

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.inputs.confirm == 'DELETE' }}
    steps:
      - name: Delete stale branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          ok=0; gone=0; fail=0
          while IFS= read -r b; do
            [ -z "$b" ] && continue
            case "$b" in main|design/r222-home-surface|song-handscroll-six-frames-r220|visual-audit/r222) echo "SKIP protected $b"; continue;; esac
            if out=$(gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$b" 2>&1); then ok=$((ok+1));
            elif echo "$out" | grep -qi "Reference does not exist\|Not Found"; then gone=$((gone+1));
            else fail=$((fail+1)); echo "FAIL $b: $out"; fi
          done <<'LIST'
