name: Owner console regression

on:
  pull_request:
    paths:
      - 'api/owner-data.js'
      - 'api/owner-session.js'
      - 'lib/owner-*.js'
      - 'lib/meta-oauth.js'
      - 'lib/threads-oauth.js'
      - 'lib/social-owner-actions.js'
      - 'src/lib/theme-skins.ts'
      - 'src/lib/owner-autopublish-client.ts'
      - 'src/components/owner/**'
      - 'src/components/owner-login-visuals-manager.tsx'
      - 'src/routes/account.tsx'
      - 'scripts/owner-*.test.mjs'
      - 'scripts/loading-gallery-group.test.mjs'
      - 'scripts/social-autopublish.test.mjs'
      - '.github/workflows/owner-console-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Owner API, OAuth, queue, and Passkey regression tests
        run: |
          node --test scripts/owner-promo-admin.test.mjs scripts/loading-gallery-group.test.mjs scripts/owner-console-links.test.mjs scripts/owner-content-hub.test.mjs scripts/r197-owner-console-cleanup.test.mjs scripts/owner-supabase-origin.test.mjs scripts/owner-session-skin-delegation.test.mjs scripts/owner-social-publisher.test.mjs scripts/social-autopublish.test.mjs scripts/owner-passkey.test.mjs scripts/owner-passkey-service-preflight.test.mjs scripts/owner-session-passkey-api.test.mjs scripts/shared-site-skin.test.mjs
      - name: Music playlist, loop, owner list and mobile utility regression
        run: |
          node --test scripts/music-playlist-choice.test.mjs scripts/r149-music-player-controls.test.mjs scripts/r157-dragon-assistant-music.test.mjs scripts/r156-owner-bulk-actions.test.mjs
      - name: WeChat offline draft and server-only API contract
        run: node --import tsx --test scripts/wechat-draft.test.mjs scripts/wechat-draft-api.test.mjs
      - name: Generate routes, build and typecheck
        run: |
          # Vite's TanStack Router plugin regenerates routeTree.gen.ts. Typechecking
          # first fails on newly added route files even when the runtime is valid.
          ./node_modules/.bin/vite build
          npm run check
