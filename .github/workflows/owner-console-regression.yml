name: Owner console regression

on:
  pull_request:
    paths:
      - 'api/owner-data.js'
      - 'api/owner-session.js'
      - 'lib/owner-*.js'
      - 'lib/meta-oauth.js'
      - 'lib/threads-oauth.js'
      - 'lib/social-owner-actions.js'
      - 'src/lib/theme-skins.ts'
      - 'src/lib/owner-autopublish-client.ts'
      - 'src/components/owner/**'
      - 'src/routes/account.tsx'
      - 'scripts/owner-*.test.mjs'
      - 'scripts/social-autopublish.test.mjs'
      - '.github/workflows/owner-console-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Owner API, OAuth, queue, and Passkey regression tests
        run: |
          node --test scripts/owner-session-skin-delegation.test.mjs scripts/owner-social-publisher.test.mjs scripts/social-autopublish.test.mjs scripts/owner-passkey.test.mjs scripts/owner-session-passkey-api.test.mjs scripts/shared-site-skin.test.mjs
      - name: Typecheck and production bundle
        run: |
          npm run check
          ./node_modules/.bin/vite build
