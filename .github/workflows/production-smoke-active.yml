name: Production smoke (active)

# Replaces the retired, manually-disabled workflow. No deployment, write access,
# payment mutations or new infrastructure. Checks only the single canonical host.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'api/**'
      - 'lib/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'vercel.json'
      - 'playwright.production.config.ts'
      - 'e2e-production/**'
      - '.github/workflows/production-smoke-active.yml'
  pull_request:
    paths:
      - 'e2e-production/**'
      - 'playwright.production.config.ts'
      - '.github/workflows/production-smoke-active.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke-active-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Real Production iPhone Safari
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROD_URL: https://zhao-wu.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # A PR tests current public Production without comparing its SHA to the PR.
      # A main push must await the exact released main commit; do not silently
      # approve a green old deployment.
      - name: Wait for the exact main release on canonical Production
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            got=$(curl --retry 2 --retry-all-errors --connect-timeout 8 --max-time 15 -fsS \
              -H 'cache-control: no-cache' \
              "$PROD_URL/release.json?ci=$(date +%s)" \
              | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{try{console.log(JSON.parse(s).release||"")}catch{console.log("")}})' || true)
            echo "attempt $i: production=${got:-missing}; expected=$GITHUB_SHA"
            [ "$got" = "$GITHUB_SHA" ] && exit 0
            sleep 15
          done
          echo "NOT VERIFIED: canonical Production did not serve exact release SHA $GITHUB_SHA"
          exit 1
      - run: npm ci --no-audit --no-fund
      - run: ./node_modules/.bin/playwright install --with-deps webkit
      - name: Canonical Production smoke (real iPhone Safari)
        run: ./node_modules/.bin/playwright test -c playwright.production.config.ts
        env:
          EXPECT_SHA: ${{ github.event_name == 'pull_request' && '' || github.sha }}
      - name: Preserve failure traces for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
