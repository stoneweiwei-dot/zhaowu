name: Language switcher mobile
on:
  pull_request:
    paths:
      - 'src/language-switcher.css'
      - 'src/components/language-switcher.tsx'
      - 'e2e/language-switcher-narrow.spec.ts'
      - '.github/workflows/language-switcher.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test e2e/language-switcher-narrow.spec.ts --project=iphone-safari
