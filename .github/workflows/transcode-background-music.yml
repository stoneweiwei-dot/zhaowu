name: Transcode background music AAC

on:
  push:
    branches:
      - fix/ios-background-music-aac
    paths:
      - .github/workflows/transcode-background-music.yml

permissions:
  contents: write

jobs:
  transcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-background-music-aac
          fetch-depth: 0
      - name: Install ffmpeg
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Fetch source MP3 and create Safari-safe AAC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/audio
          curl -fL --retry 3 --retry-delay 2 \
            -H "Referer: https://suno.com/" \
            -H "User-Agent: Mozilla/5.0" \
            "https://cdn1.suno.ai/ea42299a-8e18-44e8-91da-bd521a3cef61.mp3" \
            -o /tmp/jingfo-source.mp3
          test "$(stat -c%s /tmp/jingfo-source.mp3)" -gt 2000000
          SOURCE_DURATION="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/jingfo-source.mp3)"
          python3 - "$SOURCE_DURATION" <<'PY'
import sys
d=float(sys.argv[1])
assert 460 < d < 470, f"unexpected source duration: {d}"
PY
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,profile,sample_rate,channels,duration -of default=nw=1 /tmp/jingfo-source.mp3
          ffmpeg -hide_banner -loglevel error -y -i /tmp/jingfo-source.mp3 -vn -c:a aac -profile:a aac_low -b:a 96k -ar 48000 -movflags +faststart public/audio/jingfo-shengyuan-aac.m4a
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,profile,sample_rate,channels,duration -of default=nw=1 public/audio/jingfo-shengyuan-aac.m4a
          test "$(stat -c%s public/audio/jingfo-shengyuan-aac.m4a)" -gt 4000000
          grep -a -q "ftyp" public/audio/jingfo-shengyuan-aac.m4a
          grep -a -q "moov" public/audio/jingfo-shengyuan-aac.m4a
      - name: Commit generated asset and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "zhaowu-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/audio/jingfo-shengyuan-aac.m4a
          git rm .github/workflows/transcode-background-music.yml
          git commit -m "chore: add Safari-safe AAC background music"
          git push origin HEAD:fix/ios-background-music-aac
