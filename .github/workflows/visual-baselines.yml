name: Update visual baselines

# Regenerates Playwright screenshot baselines on the same Linux runner image
# that verifies them. Run manually (Actions -> Update visual baselines) on a
# branch, or push to a `visual-baseline/**` branch. Never runs on main.
on:
  workflow_dispatch:
  push:
    branches: ["visual-baseline/**"]

permissions:
  contents: write

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    if: github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Regenerate baselines
        run: npm run test:visual:update
      - name: Verify baselines are stable (second run must pass without updating)
        run: npm run test:visual
      - name: Commit baselines
        run: |
          git config user.name "visual-baseline-bot"
          git config user.email "visual-baseline-bot@users.noreply.github.com"
          git add e2e/__screenshots__
          git commit -m "test: update Today visual baselines [skip ci]" || exit 0
          git push
