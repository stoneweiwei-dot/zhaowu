name: Temporary visitor entry QA
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/visitor-entry-qa-temp.yml'
      - 'src/components/visitor-entrance*'
      - 'src/components/painted-home.tsx'
      - 'scripts/login-films.test.mjs'
      - 'scripts/zhaowu-features-page.test.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-visitor-auth-real-input-20261024
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Locked install
        run: npm ci --no-audit --no-fund
      - name: Real visitor form and about route tests
        run: node --test scripts/login-films.test.mjs scripts/zhaowu-features-page.test.mjs
      - name: Full production build
        run: npm run build
