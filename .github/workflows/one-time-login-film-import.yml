name: Temporary login film acceptance
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/one-time-login-film-import.yml']
permissions:
  contents: read
jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/login-original-four-films-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/login-original-four-films-20261023
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Four original films plus unchanged auth route
        run: node --test scripts/login-films.test.mjs
      - name: Production-equivalent static build
        run: npm run build
