name: Temporary login film source diagnostics
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/one-time-login-film-import.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Install browser diagnostic
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium --with-deps >/dev/null 2>&1
      - name: Inspect transfer page render without exposing download bearer URLs
        env:
          TRANSFER_PAGE: https://firestorage.ai/ja/f/oHsKQFGY_TRv
        run: |
          python - <<'PY'
          import os, urllib.parse
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            page=browser.new_page(accept_downloads=True)
            seen=set()
            def watch(response):
              u=urllib.parse.urlsplit(response.url)
              if ("firestorage.ai" in u.netloc) and ("/api/" in u.path or "/download" in u.path):
                seen.add((response.status,u.netloc,u.path[:160]))
            page.on("response",watch)
            page.goto(os.environ["TRANSFER_PAGE"],wait_until="domcontentloaded",timeout=28000)
            page.wait_for_timeout(2800)
            print("title",page.title()[:120])
            print("body",page.locator("body").inner_text()[:3500])
            print("buttons",page.locator("button").all_text_contents()[:40])
            print("links",[(a.inner_text()[:30],urllib.parse.urlsplit(a.get_attribute("href") or "").path[:110]) for a in page.locator("a").all()[:30]])
            print("network API paths", sorted(seen)[:25])
            browser.close()
          PY
