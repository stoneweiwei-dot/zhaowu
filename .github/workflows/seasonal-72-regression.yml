name: Seasonal 24 terms / 72 hou

on:
  pull_request:
    paths:
      - 'src/lib/seasonal-skins.ts'
      - 'src/lib/theme-skins.ts'
      - 'src/components/painted-home.tsx'
      - 'src/components/owner-theme-skins-manager.tsx'
      - 'scripts/seasonal-skins.test.mjs'
      - '.github/workflows/seasonal-72-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-seasonal-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: All 24 terms / 72 hou and existing art
        run: npm run test:themes
      - name: Mobile v2 homepage and guide contracts
        run: node --test scripts/home-first-impression.test.mjs scripts/home-tree.test.mjs scripts/sample-report-page.test.mjs
      # TanStack Router updates src/routeTree.gen.ts during the Vite build.
      # Compile before TypeScript validation so newly added file-routes have generated types.
      - name: Production compilation and route generation
        run: ./node_modules/.bin/vite build
      - name: Typecheck against generated routes
        run: npm run check
