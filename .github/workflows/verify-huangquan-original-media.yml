name: One-time Huangquan original media release verification
on:
  push:
    branches:
      - feat/huangquan-original-png-film-20261028
    paths:
      - .github/workflows/verify-huangquan-original-media.yml
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'stoneweiwei-dot/zhaowu'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Exact original twelve PNGs and unchanged MP4 checksums
        run: node --test scripts/huangquan-original-media.test.mjs
      - name: Production build and generated route types
        run: npm run build
      - name: Typecheck after route generation
        run: npm run check
