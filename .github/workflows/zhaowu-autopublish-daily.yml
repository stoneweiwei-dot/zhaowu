name: ZHAOWU Autopublish Daily Trigger

on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * *'
      timezone: 'Australia/Sydney'

permissions:
  contents: read

jobs:
  trigger-autopublish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger daily autopublish
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          response=$(curl -fsS -w '\nHTTP_CODE:%{http_code}' -H "Authorization: Bearer ${CRON_SECRET}" "https://zhao-wu.com/api/owner-session?action=cron.autopublish")
          echo "$response"
