name: Cloudflare Pages direct upload

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_branch:
        description: Non-production Pages branch for a safe preview upload
        required: true
        default: ci-preview
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: node --test scripts/cloudflare-pages-config.test.mjs
      - run: npm run build --ignore-scripts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://gyisxbkjzvdretbqzeuw.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_ALLOWED_HOSTS: ${{ secrets.VITE_POSTHOG_ALLOWED_HOSTS }}
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: cloudflare-pages-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Direct upload to zhaowu-prod
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip when Cloudflare credentials are not configured
        id: credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment skipped: required repository secrets are not configured."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Reject production branch dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          PREVIEW_BRANCH: ${{ inputs.preview_branch }}
        run: |
          if [ "$PREVIEW_BRANCH" = "main" ] || [ -z "$PREVIEW_BRANCH" ]; then
            echo "workflow_dispatch requires a non-empty preview branch other than main." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        if: steps.credentials.outputs.available == 'true'
        with:
          name: cloudflare-pages-dist
          path: dist
      - name: Install pinned Wrangler
        if: steps.credentials.outputs.available == 'true'
        run: npm install --global wrangler@4.45.0
      - name: Deploy production after merge
        if: steps.credentials.outputs.available == 'true' && github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy dist --project-name=zhaowu-prod --branch=main
      - name: Deploy safe preview
        if: steps.credentials.outputs.available == 'true' && github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_BRANCH: ${{ inputs.preview_branch }}
        run: wrangler pages deploy dist --project-name=zhaowu-prod --branch="$PREVIEW_BRANCH"
