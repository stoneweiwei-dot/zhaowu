name: Capture screens
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: ./node_modules/.bin/playwright test --project=capture || true
      - name: Commit captures
        run: |
          git config user.name "capture-bot"
          git config user.email "capture-bot@users.noreply.github.com"
          git add -f e2e/__capture__
          git commit -m "chore: captures [skip ci]" || exit 0
          git push
