name: Migration smoke
on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/migration-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: postgres:16
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable platform objects
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon;
          CREATE ROLE authenticated;
          CREATE ROLE service_role BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users(id uuid PRIMARY KEY, email text);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$
            SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          GRANT USAGE ON SCHEMA auth TO anon, authenticated, service_role;
          CREATE SCHEMA extensions;
          CREATE EXTENSION pgcrypto WITH SCHEMA extensions;
          CREATE SCHEMA storage;
          CREATE TABLE storage.buckets(id text PRIMARY KEY, allowed_mime_types text[], file_size_limit bigint);
          INSERT INTO storage.buckets(id) VALUES ('zhaowu-gallery');
          SQL
      - name: Apply every migration in filename order
        shell: bash
        run: |
          export LC_ALL=C
          for file in supabase/migrations/*.sql; do
            echo "Applying $file"
            psql -X -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Verify role permissions
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/migration-smoke.sql
