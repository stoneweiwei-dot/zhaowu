name: Weekly Sydney Sky Observation Update

on:
  schedule:
    # 18:15 UTC Sunday = 05:15 Monday AEDT (UTC+11) / 04:15 Monday AEST (UTC+10), before 06:00 Sydney time year-round.
    - cron: '15 18 * * 0'
  workflow_dispatch:
    inputs:
      week_start:
        description: 'Optional Sydney week-start Monday (YYYY-MM-DD); defaults to current Sydney date'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-sky-observation-update
  cancel-in-progress: false

jobs:
  update-sky-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Sydney sky observation (idempotent, preserves history on failure)
        env:
          WEEK_START: ${{ github.event.inputs.week_start }}
        run: |
          if [ -n "$WEEK_START" ]; then
            node scripts/generate-daily-sky-observation.mjs --date="$WEEK_START"
          else
            node scripts/generate-daily-sky-observation.mjs
          fi

      - name: Verify sky snapshot contract and build
        run: |
          node --test scripts/sky-snapshot-contract.test.mjs scripts/daily-sky-date.test.mjs
          npx vite build
          npx tsc --noEmit

      - name: Commit and update PR if snapshot changed
        run: |
          if git diff --quiet -- src/components/daily-sky-observation.tsx; then
            echo "No changes to src/components/daily-sky-observation.tsx; keeping existing verified snapshot."
            exit 0
          fi
          SYDNEY_DATE=$(node -e 'import("./scripts/generate-daily-sky-observation.mjs").then(m => console.log(process.env.WEEK_START || m.sydneyDateString()))')
          BRANCH="automation/weekly-sky-${SYDNEY_DATE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/components/daily-sky-observation.tsx
          git commit -m "chore(sky): update Sydney weekly observation snapshot for ${SYDNEY_DATE}"
          git push -u origin "$BRANCH"
          gh pr create --title "chore(sky): Sydney weekly sky snapshot ${SYDNEY_DATE}" \
                       --body "Automated weekly Sydney sky observation snapshot generated via approved self-hosted astronomy-engine." \
                       --head "$BRANCH" --base main || echo "::warning::Could not create the pull request. The snapshot is on $BRANCH. Check existing PRs and the repository's Actions PR permissions."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEEK_START: ${{ github.event.inputs.week_start }}
