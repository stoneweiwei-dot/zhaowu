name: One-time Supabase public media migration

on:
  push:
    branches:
      - supabase-static-cutover-2026-09-19
    paths:
      - scripts/materialize-supabase-static-media.py
      - .github/workflows/supabase-static-media-migration.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supabase-static-media-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: supabase-static-cutover-2026-09-19
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned image encoder
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Materialize public media from Supabase
        run: python scripts/materialize-supabase-static-media.py

      - name: Commit optimized static media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "zhaowu-media-migration"
          git config user.email "zhaowu-media-migration@users.noreply.github.com"
          git add public/backgrounds/supabase-migrated public/audio/river-in-my-breathing-2.m4a docs/backups/supabase-static-media-migration-2026-09-19.json
          if git diff --cached --quiet; then
            echo "No media changes to commit."
            exit 0
          fi
          git commit -m "assets: migrate Supabase public media to Vercel static"
          git push origin HEAD:supabase-static-cutover-2026-09-19
