name: One-time Supabase public media migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-static-media-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout selected workflow revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned image encoder
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Materialize public media from Supabase
        run: python scripts/materialize-supabase-static-media.py

      - name: Validate generated media
        shell: bash
        run: |
          set -euo pipefail
          test -s public/audio/river-in-my-breathing-2.m4a
          test -s docs/backups/supabase-static-media-migration-2026-09-19.json
          test "$(find public/backgrounds/supabase-migrated -type f -name '*.webp' | wc -l)" -gt 0
          python -m json.tool docs/backups/supabase-static-media-migration-2026-09-19.json >/dev/null

      - name: Upload migration output for review
        uses: actions/upload-artifact@v4
        with:
          name: supabase-static-media-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: |
            public/backgrounds/supabase-migrated
            public/audio/river-in-my-breathing-2.m4a
            docs/backups/supabase-static-media-migration-2026-09-19.json
