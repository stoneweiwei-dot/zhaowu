name: Import six Zhaowu social images (one-time)
on:
  push:
    branches:
      - assets/zhaowu-social-20261111
    paths:
      - .github/workflows/import-zhaowu-social-assets-once.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified source and commit exactly six PNG files
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.firestorage.ai/dev/file/shares/dfbe-y0nT2vA/files/01a1c5c966407685994e6cc1e1066f83/download"
          curl -fsSL --retry 2 -X POST -H 'Accept: application/json' "$endpoint" -o /tmp/zhaowu-download.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/zhaowu-download.json'))
          url=d.get('downloadUrl')
          if not isinstance(url,str) or not url.startswith('https://'):
              raise SystemExit('No verified HTTPS downloadUrl returned')
          with open('/tmp/zhaowu-url','w') as f: f.write(url)
          PY
          curl -fsSL --retry 2 "$(cat /tmp/zhaowu-url)" -o /tmp/zhaowu-assets.zip
          echo "753264f6ec02f54128dd7d65507bc3207fb8e3e00a4c0f2d2d18fd34fe9b5353  /tmp/zhaowu-assets.zip" | sha256sum -c -
          python3 - <<'PY'
          from zipfile import ZipFile
          archive='/tmp/zhaowu-assets.zip'
          names={
              'public/social/zhaowu/01_qianlong_9x16.png',
              'public/social/zhaowu/01_qianlong_IG_4x5.png',
              'public/social/zhaowu/02_qianwei_tian_9x16.png',
              'public/social/zhaowu/02_qianwei_tian_IG_4x5.png',
              'public/social/zhaowu/03_sleeping_dragon_9x16.png',
              'public/social/zhaowu/03_sleeping_dragon_IG_4x5.png',
          }
          with ZipFile(archive) as z:
              if set(z.namelist()) != names:
                  raise SystemExit('ZIP entries differ from the six approved assets')
              for n in names:
                  z.extract(n,'.')
          PY
          git add public/social/zhaowu/*.png
          if git diff --cached --quiet; then echo 'All six files already present'; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets(social): import six approved Song-style PNG images"
          git push origin HEAD:assets/zhaowu-social-20261111
