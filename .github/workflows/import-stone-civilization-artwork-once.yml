name: Import STONE original artwork (one-time)
on:
  push:
    branches:
      - content/civilization-timeline-sky-nav-20261023
    paths:
      - .github/workflows/import-stone-civilization-artwork-once.yml
permissions:
  contents: write
jobs:
  import-original:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download owner-provided original PNG and verify exact SHA-256
        run: |
          node --input-type=module <<'NODE'
          import { writeFile, mkdir } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const base = 'https://api.firestorage.ai/dev/file/shares/lyAUa98ieZYF';
          const entryId = '01a1660f33d375ed8fb9584ac1c078ea';
          const expectedSize = 2736517;
          const expectedSha = 'fe37936b94efcf936ce48fe3e62c770ec81976777bd3aa6bcb738173bcbbbf1a';
          const list = await fetch(base + '/files?maxResults=1000');
          if (!list.ok) throw new Error('Temporary image source unavailable (' + list.status + ')');
          const files = (await list.json()).files ?? [];
          if (!files.some(x => x.fileId === entryId)) throw new Error('Exact image not found');
          const sign = await fetch(base + '/files/' + entryId + '/download', {method:'POST'});
          if (!sign.ok) throw new Error('Image download signing failed (' + sign.status + ')');
          const {downloadUrl} = await sign.json();
          const signed = new URL(downloadUrl);
          if (signed.protocol !== 'https:' || signed.hostname !== 's3.ap-northeast-1.wasabisys.com') throw new Error('Unexpected asset host');
          const image = await fetch(downloadUrl);
          if (!image.ok) throw new Error('Asset retrieval failed (' + image.status + ')');
          const bytes = Buffer.from(await image.arrayBuffer());
          const actualSha = createHash('sha256').update(bytes).digest('hex');
          if (bytes.length !== expectedSize || actualSha !== expectedSha) throw new Error('Original PNG integrity mismatch');
          const dest = 'public/articles/civilization-timeline-2025-2030-stone-original.png';
          await mkdir('public/articles', {recursive:true});
          await writeFile(dest, bytes);
          console.log('Verified original PNG by SHA256, size, and destination.');
          NODE
      - name: Commit original asset and remove import-only workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/articles/civilization-timeline-2025-2030-stone-original.png
          git rm -- .github/workflows/import-stone-civilization-artwork-once.yml
          git commit -m "assets: preserve original STONE civilization timeline PNG"
          git push origin "HEAD:refs/heads/content/civilization-timeline-sky-nav-20261023"
