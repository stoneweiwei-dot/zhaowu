# One-time manual Supabase backup (zhaowu-core)
#
# Manual trigger ONLY (workflow_dispatch). Nothing runs on a schedule and
# nothing runs on push. Shi must add the two repo secrets first and press
# "Run workflow" by hand; until then this file is inert.
#
# Required secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_PROJECT_REF  — zhaowu-core project ref (gyisxbkjzvdretbqzeuw)
#   SUPABASE_DB_PASSWORD  — the project's database password (Dashboard >
#                           Settings > Database). Never put it in this file.
#
# What it does: `supabase db dump` of the live database (schema + data,
# NOTE: uses the IPv4 Transaction Pooler (port 6543), NOT the direct
# connection (db.<ref>.supabase.co:5432) — GitHub Actions runners have no
# IPv6 and direct connections require it (run #2 failed: Network is
# unreachable). Pooler host: aws-0-ap-northeast-1.pooler.supabase.com.
# including auth users) into one SQL file, uploaded as a run artifact with
# 7-day retention. It does NOT enable PITR, does NOT change any table,
# policy, or setting, and does NOT deploy anything.
#
# DATA HANDLING WARNING: the dump contains real user data (birth data,
# report entitlements, owner passkey public keys). Download it, move it to
# the existing cold store (Dropbox /Zhaowu-Backup/), then delete the
# artifact. Never commit a dump to the repo, never post it anywhere, and
# never treat a dump as verified until a restore rehearsal has been done
# on an isolated project (see docs/STANDBY-BACKUP-PLAN.md §2.3).
#
# This is a stop-gap, not the landing. The durable backup is Supabase
# platform backups / PITR, which can only be confirmed and enabled in the
# Supabase dashboard (see supabase/verify-rls-backup.sql query 8).


name: Manual Supabase backup (zhaowu-core)


on:
  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: supabase-manual-backup
  cancel-in-progress: false


jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout selected workflow revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest


      - name: Dump live database (schema + data)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          supabase db dump \
            --db-url "postgres://postgres.${SUPABASE_PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres" \
