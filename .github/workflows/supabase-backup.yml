# Supabase backup (zhaowu-core) — hourly after successful deploys
#
# Triggers: hourly schedule + manual workflow_dispatch.
# A scheduled run first checks whether the live site has moved since the
# last successful backup (live release.json SHA vs last successful run's
# head SHA); if nothing new deployed, it exits without dumping.
#
# Required secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_PROJECT_REF  — zhaowu-core project ref (gyisxbkjzvdretbqzeuw)
#   SUPABASE_DB_PASSWORD  — the project's database password (Dashboard >
#                           Settings > Database). Never put it in this file.
#
# What it does: `supabase db dump` of the live database (schema + data,
# including auth users) into one SQL file, uploaded as a run artifact with
# 7-day retention. It does NOT enable PITR, does NOT change any table,
# policy, or setting, and does NOT deploy anything.
#
# CONNECTION — READ THIS BEFORE CHANGING THE PORT: pg_dump MUST use the
# Session pooler (port 5432), NEVER the Transaction pooler (port 6543).
# The 2026-11-24 run used 6543 and silently produced a schema-only dump
# (25 CREATE TABLE, zero COPY, exit 0). Transaction pooling hands each
# statement to a different backend connection, so pg_dump cannot hold the
# session/snapshot it needs. Session mode gives one dedicated backend
# connection for the whole dump and is IPv4-reachable from GitHub
# runners (the direct host db.<ref>.supabase.co:5432 is IPv6-only).
# Pooler host: aws-0-ap-northeast-1.pooler.supabase.com.
#
# DATA GUARD: the dump step fails unless the SQL contains COPY blocks,
# so a silent schema-only dump can never again pass as a success.
#
# DATA HANDLING WARNING: the dump contains real user data (birth data,
# report entitlements, owner passkey public keys). Download it, move it to
# the existing cold store (Dropbox /Zhaowu-Backup/), then delete the
# artifact. Never commit a dump to the repo, never post it anywhere, and
# never treat a dump as verified until a restore rehearsal has been done
# on an isolated project (see docs/STANDBY-BACKUP-PLAN.md §2.3).

name: Supabase backup (zhaowu-core)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: supabase-manual-backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check whether a new deploy needs backing up
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Manual run: always dump."
            exit 0
          fi
          live_sha="$(curl -fsSL https://zhao-wu.com/release.json | python3 -c 'import sys,json; print(json.load(sys.stdin)["release"])')"
          last_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/supabase-backup.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')"
          echo "live_sha=$live_sha last_backup_sha=$last_sha"
          if [ -n "$last_sha" ] && [ "$live_sha" = "$last_sha" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Live site unchanged since last successful backup; nothing to dump."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "New deploy since last backup; dumping."
          fi

      - name: Checkout selected workflow revision
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Supabase CLI
        if: steps.check.outputs.skip != 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump live database (schema + data)
        if: steps.check.outputs.skip != 'true'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          supabase db dump \
            --db-url "postgres://postgres.${SUPABASE_PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres" \
            -f "zhaowu-backup-${SUPABASE_PROJECT_REF}-$(date -u +%Y%m%d-%H%M%S).sql"
          test -s zhaowu-backup-*.sql
          grep -c "CREATE TABLE" zhaowu-backup-*.sql
          copy_blocks="$(grep -c '^COPY ' zhaowu-backup-*.sql || true)"
          echo "COPY blocks (tables with data): $copy_blocks"
          if [ "$copy_blocks" -eq 0 ]; then
            echo "::error::Dump contains no data (zero COPY blocks). Refusing to upload a schema-only dump."
            exit 1
          fi
          ls -la zhaowu-backup-*.sql

      - name: Upload dump for manual cold-storage
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: zhaowu-backup-*.sql
