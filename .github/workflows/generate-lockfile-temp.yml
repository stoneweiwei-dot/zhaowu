name: Generate lockfile (temporary)

on:
  push:
    branches:
      - codex/lockfile-npm-ci-20260826

permissions:
  contents: write

jobs:
  generate:
    if: ${{ hashFiles('package-lock.json') == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/lockfile-npm-ci-20260826

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate package-lock.json from package.json
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Commit generated lockfile
        run: |
          test -f package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: track generated npm lockfile"
          git push origin HEAD:codex/lockfile-npm-ci-20260826
