name: Generate lockfile (temporary)

on:
  push:
    branches:
      - codex/lockfile-npm-ci-20260826

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/lockfile-npm-ci-20260826

      - name: Stop if lockfile already exists
        id: lock
        run: |
          if test -f package-lock.json; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js 24
        if: steps.lock.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate package-lock.json from package.json
        if: steps.lock.outputs.exists != 'true'
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Commit generated lockfile
        if: steps.lock.outputs.exists != 'true'
        run: |
          test -f package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: track generated npm lockfile"
          git push origin HEAD:codex/lockfile-npm-ci-20260826
