name: Borrowed Star release build gate

on:
  pull_request:
    paths:
      - 'src/routes/-mythic-atlas-borrow-star.tsx'
      - 'public/mythic-atlas/borrow-star/**'
      - 'scripts/borrow-star-assets.test.mjs'
      - 'package.json'
      - 'e2e-production/smoke.spec.ts'
      - '.github/workflows/borrow-star-release-gate.yml'

permissions:
  contents: read

jobs:
  illustrated-build:
    name: Nine original illustrations / Vite / TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check nine permanent images and three-language page references
        run: node --test scripts/borrow-star-assets.test.mjs
      - name: Run real release build
        run: npm run build
