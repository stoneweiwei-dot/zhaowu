name: One-time original lamp artwork import
on:
  push:
    branches:
      - content/nine-heavens-lamps-illustrated-20261031
permissions:
  contents: write
jobs:
  import-verified-art:
    name: Download four original PNGs and commit permanent WebP assets
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fixed image encoder
        run: python -m pip install 'Pillow>=11,<13'
      - name: Download, verify and encode original images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          from urllib.request import Request, urlopen
          import hashlib
          ASSETS=[{"index":1,"sha":"a4cb28702a6100dc4a7d44264dbff10750ea39fa66ed2ae2be06256a5406a14a","url":"https://s3.ap-northeast-1.wasabisys.com/firestorage-ai-northeast-1/ai/URrGRqINPzKiJb6tawXGlrjKtDyqBJ9g/files/01a1923de17b7609bd4a8ab6e39d7f53?response-content-disposition=attachment%3B%20filename%3D%22download%22%3B%20filename%2A%3DUTF-8%27%27a_vertical_fantasy_chinese_ink_watercolor_style_il.png&response-content-type=image%2Fpng&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=ZSZ402MT2WS96N566PRV%2F20261031%2Fap-northeast-1%2Fs3%2Faws4_request&X-Amz-Date=20261031T135755Z&X-Amz-Expires=3600&X-Amz-SignedHeaders=host&X-Amz-Signature=a6504b6f231fddfe9ae14d0f34928418e43a20f5776b0a1285f4f361f575ce29"},{"index":2,"sha":"943bb8e1621003155aa982082ffe2ce863c2f423eeff5def7b9ad438e1be9654","url":"https://s3.ap-northeast-1.wasabisys.com/firestorage-ai-northeast-1/ai/URrGRqINPzKiJb6tawXGlrjKtDyqBJ9g/files/01a1923e1fef707798b4535afd293239?response-content-disposition=attachment%3B%20filename%3D%22download%22%3B%20filename%2A%3DUTF-8%27%27imagegen.png&response-content-type=image%2Fpng&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=ZSZ402MT2WS96N566PRV%2F20261031%2Fap-northeast-1%2Fs3%2Faws4_request&X-Amz-Date=20261031T135825Z&X-Amz-Expires=3600&X-Amz-SignedHeaders=host&X-Amz-Signature=0cde789b93f384656ebb60d7caa6209d48c5f387e87e5fbd69b6c9b60b36d3de"},{"index":3,"sha":"5f1d9722400f9d9e18b3391ad900c4a006f0333ce7f6b1578c98275c70bc0ee3","url":"https://s3.ap-northeast-1.wasabisys.com/firestorage-ai-northeast-1/ai/URrGRqINPzKiJb6tawXGlrjKtDyqBJ9g/files/01a1923e3bb275d1b5cb805a00586e5a?response-content-disposition=attachment%3B%20filename%3D%22download%22%3B%20filename%2A%3DUTF-8%27%27imagegen.png&response-content-type=image%2Fpng&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=ZSZ402MT2WS96N566PRV%2F20261031%2Fap-northeast-1%2Fs3%2Faws4_request&X-Amz-Date=20261031T135830Z&X-Amz-Expires=3600&X-Amz-SignedHeaders=host&X-Amz-Signature=13821482d20a4a74f1b2a96f4a2883b16d4413223e540d65c8f72aa9b7583440"},{"index":4,"sha":"a515b2b9dafde3344dd5894daeb6192572128a65a868ea00644499acf90aafd1","url":"https://s3.ap-northeast-1.wasabisys.com/firestorage-ai-northeast-1/ai/URrGRqINPzKiJb6tawXGlrjKtDyqBJ9g/files/01a192439ed77582acaf66a8c9ad5a07?response-content-disposition=attachment%3B%20filename%3D%22download%22%3B%20filename%2A%3DUTF-8%27%27ZW-lamps-04-correct-awakening.png&response-content-type=image%2Fpng&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=ZSZ402MT2WS96N566PRV%2F20261031%2Fap-northeast-1%2Fs3%2Faws4_request&X-Amz-Date=20261031T140124Z&X-Amz-Expires=3600&X-Amz-SignedHeaders=host&X-Amz-Signature=573b6c87b4616f1a786d1078800e8484c7b2a03166ff3f0d1319ffa24e9e4d4a"}]
          root=Path(".")
          (root/"art-source"/"lamps").mkdir(parents=True,exist_ok=True)
          (root/"public"/"articles").mkdir(parents=True,exist_ok=True)
          digests=[]
          for rec in ASSETS:
              index=rec["index"]
              request=Request(rec["url"],headers={"User-Agent":"zhaowu-art-import/1.0"})
              with urlopen(request,timeout=90) as response:
                  data=response.read()
              digest=hashlib.sha256(data).hexdigest()
              assert digest==rec["sha"], f"Source image mismatch for {index}: {digest}"
              assert data[:8]==bytes.fromhex("89504e470d0a1a0a"), f"Not a PNG {index}"
              image=Image.open(BytesIO(data)).convert("RGB")
              assert image.size==(941,1672), f"Unexpected dimensions {index}: {image.size}"
              original=root/"art-source"/"lamps"/f"lamps-{index:02d}-original.png"
              original.write_bytes(data)
              output=root/"public"/"articles"/f"lamps-parable-{index:02d}.webp"
              image.save(output,format="WEBP",quality=85,method=6)
              assert output.stat().st_size>200000, f"WEBP too small: {index}"
              assert output.read_bytes()[:4]==b"RIFF" and output.read_bytes()[8:12]==b"WEBP"
              digests.append(digest)
              print(f"Image {index}: PNG SHA256 {digest}; WEBP {output.stat().st_size} bytes")
          assert len(set(digests))==4,"Different scenes must have different source images"
          for index in range(1,5):
              placeholder=root/"public"/"articles"/f"lamps-parable-{index:02d}.svg"
              if placeholder.exists():
                  placeholder.unlink()
          workflow=root/".github"/"workflows"/"lamps-art-import-once.yml"
          if workflow.exists():
              workflow.unlink()
          print("Artwork binary import and placeholder cleanup complete")
          
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify complete article and assets and production-equivalent build
        run: |
          npm ci --no-audit --no-fund
          npm run prebuild
          npm run build
      - name: Commit real media and drop one-time importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A art-source/lamps public/articles/lamps-parable-01.svg public/articles/lamps-parable-02.svg public/articles/lamps-parable-03.svg public/articles/lamps-parable-04.svg public/articles/lamps-parable-01.webp public/articles/lamps-parable-02.webp public/articles/lamps-parable-03.webp public/articles/lamps-parable-04.webp .github/workflows/lamps-art-import-once.yml
          git diff --cached --quiet && { echo "Expected artwork was not imported"; exit 1; }
          git commit -m "content(lamps): import four verified original PNG and WebP files"
          git push origin HEAD:refs/heads/content/nine-heavens-lamps-illustrated-20261031
