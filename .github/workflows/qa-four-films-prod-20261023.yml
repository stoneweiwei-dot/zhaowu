name: Temporary canonical animated login acceptance
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/qa-four-films-prod-20261023.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify all four permanent canonical video assets
        run: |
          python - <<'PY'
          import urllib.request
          base="https://zhao-wu.com/login-films/"
          for slug in ["flute-dragon","dragon-portrait","lotus-sunlight","imperial-cat"]:
            for ext,mime in [("mp4","video/mp4"),("jpg","image/jpeg")]:
              req=urllib.request.Request(base+slug+"."+ext,method="HEAD",headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=20) as r:
                kind=(r.headers.get("content-type") or "").lower()
                length=int(r.headers.get("content-length") or "0")
                print(slug,ext,r.status,kind,length)
                assert r.status==200 and mime in kind and length>10000
          PY
      - name: Install isolated browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium --with-deps >/dev/null 2>&1
      - name: Verify film motion, controls and features navigation at iPhone width
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            page=browser.new_page(viewport={"width":390,"height":844},device_scale_factor=2,is_mobile=True,has_touch=True,reduced_motion="no-preference")
            page.goto("https://zhao-wu.com/login",wait_until="domcontentloaded",timeout=30000)
            film=page.locator("[data-login-film-video]")
            film.wait_for(state="attached",timeout=25000)
            assert film.count()==1
            first=film.get_attribute("src")
            assert first and first.endswith("/flute-dragon.mp4"),first
            page.wait_for_function("() => !!document.querySelector('video[data-login-film-video]') && document.querySelector('video[data-login-film-video]').currentTime > 0.15",timeout=18000)
            controls=page.locator("[data-login-film-controls] button")
            assert controls.count()==3
            controls.nth(1).click()
            assert page.locator("[data-login-film-video]").get_attribute("src").endswith("/dragon-portrait.mp4")
            assert page.locator("[data-owner-passkey-login]").count()<=1
            assert page.locator("input#owner-account").count()==1
            assert page.locator("input#login-secret").count()==1
            sw=page.evaluate("document.documentElement.scrollWidth")
            vw=page.evaluate("document.documentElement.clientWidth")
            print("login viewport",vw,"scroll",sw)
            assert sw<=vw+2, "horizontal overflow on login"
            page.locator("[data-zhaowu-discover-link] a").click()
            page.wait_for_url("**/about",timeout=25000)
            page.locator("[data-zhaowu-features-page]").wait_for(timeout=10000)
            page.wait_for_timeout(1400)
            count=page.locator("[data-zhaowu-features-page] .zw-about-feature").count()
            print("about articles",count,"URL",page.url,"heading",page.locator("h1").all_text_contents()[:3])
            print("feature page text length",len(page.locator("[data-zhaowu-features-page]").inner_text()))
            assert count>=7, f"Expected at least seven feature sections, received {count}"
            sw=page.evaluate("document.documentElement.scrollWidth")
            vw=page.evaluate("document.documentElement.clientWidth")
            print("about viewport",vw,"scroll",sw)
            assert sw<=vw+2, "horizontal overflow on features page"
            browser.close()
          PY
