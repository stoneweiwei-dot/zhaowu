name: One-time import of verified original Huangquan media
on:
  push:
    branches:
      - feat/huangquan-original-png-film-20261028
    paths:
      - .github/workflows/import-huangquan-original-media.yml
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'stoneweiwei-dot/zhaowu'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Download and verify original source bytes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request, zipfile, tempfile
          config = json.loads(pathlib.Path('docs/mythic-atlas/huangquan-original-media-20261028.json').read_text())
          assets = [
            ('-Q4lPxQV2OEk', '01a17fcb2d4f7480bf1b0849ae10fef0', 'source.zip', config['sourceZipSha256']),
            ('jI6HQYlUDSdK', '01a17fcb662e705fbb4ff6d25d88b6b7', 'original.mp4', config['film']['sha256']),
          ]
          def fetch(share, file_id, dest, expected):
            api = f'https://api.firestorage.ai/dev/file/shares/{share}/files/{file_id}/download'
            req = urllib.request.Request(api, data=b'', method='POST', headers={'Origin':'https://firestorage.ai','Referer':'https://firestorage.ai/','User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=40) as response:
              signed = json.load(response)['downloadUrl']
            digest=hashlib.sha256()
            with urllib.request.urlopen(signed,timeout=180) as response, open(dest,'wb') as output:
              while chunk:=response.read(2**20):
                digest.update(chunk);output.write(chunk)
            actual=digest.hexdigest()
            if actual!=expected: raise ValueError(f'Source SHA256 mismatch for {dest}: {actual}')
            print('Verified exact original bytes:',dest,pathlib.Path(dest).stat().st_size)
          with tempfile.TemporaryDirectory() as td:
            td=pathlib.Path(td)
            for share,asset_id,file_name,expected in assets:
              fetch(share,asset_id,td/file_name,expected)
            z=zipfile.ZipFile(td/'source.zip')
            expected_images={img['file']:img['sha256'] for img in config['images']}
            found={pathlib.PurePosixPath(name).name for name in z.namelist() if name.endswith('.png')}
            if found!=set(expected_images):raise ValueError(f'Archive PNG set mismatch: {found ^ set(expected_images)}')
            out=pathlib.Path('public/mythic-atlas/originals')
            out.mkdir(parents=True,exist_ok=True)
            for name,digest in expected_images.items():
              b=z.read('huangquan-twelve-originals/'+name)
              if not b.startswith(b'\x89PNG\r\n\x1a\n') or hashlib.sha256(b).hexdigest()!=digest:
                raise ValueError('PNG verification failure '+name)
              f=out/name
              if f.exists() and f.read_bytes()!=b:raise ValueError('Refuse overwrite '+str(f))
              f.write_bytes(b)
            film=pathlib.Path('public/mythic-atlas/films')/config['film']['file']
            film.parent.mkdir(parents=True,exist_ok=True)
            movie=(td/'original.mp4').read_bytes()
            if len(movie)!=config['film']['size'] or movie[4:8]!=b'ftyp':raise ValueError('MP4 signature/size mismatch')
            if film.exists() and film.read_bytes()!=movie:raise ValueError('Refuse overwrite '+str(film))
            film.write_bytes(movie)
            print('Verified imported files:',len(expected_images),'PNGs and 1 original MP4')
          PY
      - name: Commit exact media bytes to the existing feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/mythic-atlas/originals/*.png public/mythic-atlas/films/huangquan-chronicles.mp4
          if git diff --cached --quiet; then echo 'Identical originals already committed'; exit 0; fi
          git commit -m "assets(mythic): import original twelve PNGs and original Huangquan MP4"
          git push origin HEAD:refs/heads/feat/huangquan-original-png-film-20261028
