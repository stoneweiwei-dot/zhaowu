    <script>
      (() => {
        const embeddedRelease = "__ZHAOWU_RELEASE__";
        if (!embeddedRelease || embeddedRelease === "dev") return;
        fetch("/release.json?bootstrap=" + Date.now(), {
          cache: "no-store",
          credentials: "same-origin",
          headers: { "Cache-Control": "no-cache" }
        })
          .then((response) => response.ok ? response.json() : null)
          .then((payload) => {
            const freshRelease = typeof payload?.release === "string" ? payload.release.trim() : "";
            if (!freshRelease || freshRelease === embeddedRelease) return;
            const url = new URL(window.location.href);
            url.searchParams.set("zw_release", freshRelease);
            url.searchParams.set("zw_bootstrap", String(Date.now()));
            window.location.replace(url.toString());
          })
          .catch(() => undefined);
      })();
    </script>
