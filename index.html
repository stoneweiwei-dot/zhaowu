    <!-- Canonical display typeface: declared as --font-display across the CSS authority chain
         but never previously loaded as a web font, so it only ever rendered on devices with
         Songti TC pre-installed (Apple only). Loading it here fixes CJK typography on
         Android/Windows/Linux without touching any component or layout file. -->

    <script>
      (function () {
        try {
          var savedLanguage = localStorage.getItem("zhaowu.display-language");
          if (["zh-Hant", "zh-Hans", "en"].indexOf(savedLanguage) === -1) {
            savedLanguage = "zh-Hant";
            localStorage.setItem("zhaowu.display-language", savedLanguage);
          }
          document.documentElement.lang = savedLanguage;
          /* Night mode is switched off (owner 2026-10-03): always day, and drop any saved night choice. */
          if (localStorage.getItem("zhaowu.theme.v1") === "night") localStorage.setItem("zhaowu.theme.v1", "day");
        } catch (e) {}
      })();
    </script>
