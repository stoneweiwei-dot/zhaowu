# Netlify is ARCHIVE-ONLY. No runtime, no API, no automatic builds.
# Continuous Deployment should be disabled / repo unlinked in Netlify Dashboard.
# This file forces any accidental Git trigger to exit immediately.

[build]
  command = "echo 'archive-only: build skipped' && exit 0"
  publish = "dist"
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "24"

# No functions. No /api/* runtime. Existing public deployment is historical archive only.
# All production traffic and APIs live on Vercel stone-zhaowu-official.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
