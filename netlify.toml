# Netlify is intentionally archived for this repository.
# Official production hosting is Vercel: https://stone-zhaowu-official.vercel.app/
# Exit code 0 tells Netlify to skip Git-triggered builds.
[build]
  ignore = "exit 0"
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
