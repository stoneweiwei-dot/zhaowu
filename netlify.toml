[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  ignore = "if git log -1 --pretty=%B | grep -Fq '[netlify-bridge-deploy]'; then exit 1; else exit 0; fi"

[build.environment]
  NODE_VERSION = "24"

# Legacy iPhone Home Screen compatibility bridge.
# Netlify is not a second production build. It preserves the historical origin
# only for already-installed PWAs and transparently proxies the live Vercel app.
[[redirects]]
  from = "/*"
  to = "https://stone-zhaowu-official.vercel.app/:splat"
  status = 200
  force = true

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/release.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/tea-guardians/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/report-visuals/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
