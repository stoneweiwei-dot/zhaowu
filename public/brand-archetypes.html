function drawAtlas(){
var out="";
getGroupOrder().forEach(function(g){var group=groups[g];out+='<section class="motive" data-group="'+g+'"><h3>'+text3(group.name)+'</h3><p>'+text3(group.summary)+'</p>';

out+='</section>';});

function score(){
var archetypeScores=Array(12).fill(0),groupScores=[0,0,0,0],last=Array(12).fill(-1),lastG=[-1,-1,-1,-1];
answers.forEach(function(g,q){if(g<0)return;var id=g*3+(q%3);archetypeScores[id]++;groupScores[g]++;last[id]=q;lastG[g]=q;});
function best(ids,values,recency){return ids.slice().sort(function(a,b){return values[b]-values[a]||recency[b]-recency[a]||a-b;})[0];}
var g=best([0,1,2,3],groupScores,lastG);
var candidates=[g*3,g*3+1,g*3+2];
var primary=best(candidates,archetypeScores,last);
var secondary=best(archetypes.map(function(_,i){return i;}).filter(function(i){return i!==primary;}),archetypeScores,last);
return{primary:primary,secondary:secondary,g:g};
}

function copyText(value,el){
function ok(){el.textContent=t("copied");byId("copy-status").textContent=t("copied");}
function fail(){byId("copy-status").textContent=t("copyFail");}
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(value).then(ok,fail);return;}
try{var ta=document.createElement("textarea");ta.value=value;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var success=document.execCommand("copy");ta.remove();if(success)ok();else fail();}catch(e){fail();}
}
function render(){renderStatic();drawAtlas();showQuiz();}

byId("choices").addEventListener("click",function(e){var b=e.target.closest("button[data-choice]");if(!b)return;answers[step]=Number(b.dataset.choice);showQuiz();});
byId("prev").onclick=function(){if(step>0){step--;showQuiz();}};
byId("next").onclick=function(){if(answers[step]===-1)return;if(step<11){step++;showQuiz();}else{finalResult=score();phase="result";chosen=finalResult.primary;render();}};
document.querySelectorAll("[data-lang]").forEach(function(el){el.onclick=function(){setLang(Number(el.dataset.lang));};});
byId("start-cta").onclick=function(){if(phase==="intro"){phase="quiz";step=0;render();}};
try{var hash=location.hash.match(/^#type=(0[1-9]|1[0-2])$/);if(hash)chosen=Number(hash[1])-1;}catch(e){}
var preferred=navigator.language||"";if(/^zh-(CN|SG)/i.test(preferred))lang=1;else if(!/^zh/i.test(preferred))lang=2;
render();
