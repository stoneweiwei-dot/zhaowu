<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1900" role="img" aria-labelledby="title desc">
<title id="title">人多少要懂一點玄學：23 條生活提醒</title>
<desc id="desc">以民俗作為生活觀照，提醒保持善意、照顧自己並踏實行動。</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#fbf5e9"/><stop offset="1" stop-color="#eee1cd"/></linearGradient><linearGradient id="seal"><stop stop-color="#a64132"/><stop offset="1" stop-color="#7e2d27"/></linearGradient></defs>
<rect width="900" height="1900" rx="38" fill="url(#bg)"/>
<circle cx="758" cy="118" r="61" fill="#e7cfaa" opacity=".54"/><circle cx="758" cy="118" r="39" fill="#fbf5e9" opacity=".72"/>
<path d="M65 77h176M65 87h96" stroke="#a64132" stroke-width="3" opacity=".7"/>
<text x="65" y="166" fill="#7e2d27" font-size="24" letter-spacing="5" font-family="sans-serif">昭梧 · 生活札記</text>
<text x="65" y="244" fill="#292820" font-size="52" font-weight="700" font-family="sans-serif">人多少要懂一點玄學</text>
<text x="65" y="294" fill="#6e6658" font-size="27" font-family="sans-serif">民俗作參考，生活靠經營。</text>
<path d="M65 326h770" stroke="#bfae92" stroke-width="2"/>
<g><circle cx="91" cy="372" r="20" fill="url(#seal)"/><text x="91" y="380" text-anchor="middle" fill="#fffaf0" font-size="17" font-weight="700" font-family="sans-serif">1</text><text x="130" y="380" fill="#302d27" font-size="25" font-family="sans-serif">氣味受生活習慣影響，不能判業力</text><path d="M130 398h705" stroke="#d8cbb6" stroke-width="1"/></g>
<g><circle cx="91" cy="429" r="20" fill="url(#seal)"/><text x="91" y="437" text-anchor="middle" fill="#fffaf0" font-size="17" font-weight="700" font-family="sans-serif">2</text><text x="130" y="437" fill="#302d27" font-size="25" font-family="sans-serif">敏感是一種感受方式，不必解讀成天選</text><path d="M130 455h705" stroke="#d8cbb6" stroke-width="1"/></g>
<g><circle cx="91" cy="486" r="20" fill="url(#seal)"/><text x="91" y="494" text-anchor="middle" fill="#fffaf0" font-size="17" font-weight="700" font-family="sans-serif">3</text><text x="130" y="494" fill="#302d27" font-size="25" font-family="sans-serif">同屬龍，不能保證一生無憂</text><path d="M130 512h705" stroke="#d8cbb6" stroke-width="1"/></g>
<g><circle cx="91" cy="543" r="20" fill="url(#seal)"/><text x="91" y="551" text-anchor="middle" fill="#fffaf0" font-size="17" font-weight="700" font-family="sans-serif">4</text><text x="130" y="551" fill="#302d27" font-size="25" font-family="sans-serif">同屬馬，是巧合，不是順遂保證</text><path d="M130 569h705" stroke="#d8cbb6" stroke-width="1"/></g>
<g><circle cx="91" cy="600" r="20" fill="url(#seal)"/><text x="91" y="608" text-anchor="middle" fill="#fffaf0" font-size="17" font-weight="700" font-family="sans-serif">5</text><text x="130" y="608" fill="#302d27" font-size="25" font-family="sans-serif">姓名筆畫是民俗，好運仍靠行動</text><path d="M130 626h705" stroke="#d8cbb6" stroke-width="1"/></g>
<g><circle cx="91" cy="657" r="20" fill="url(#seal)"/><text x="91" y="665" text-anchor="middle" fill="#fffaf0" font-size="17" font-weight="700" font-family="sans-serif">6</text><text x="130" y="665" fill="#302d27" font-size="25" font-family="sans-serif">牙齒整潔加分，人緣事業仍需經營</text><path d="M130 683h705" stroke="#d8cbb6" stroke-width="1"/></g>
<g><circle cx="91" cy="714" r="20" fill="url(#seal)"/><text x="91" y="722" text-anchor="middle" fill="#fffaf0" font-size="17" font-weight="700" font-family="sans-serif">7</text><text x="130" y="722" fill="#302d27" font-size="25" font-family="sans-serif">狀態好時把握機會，疲憊時就休息</text><path d="M130 740h705" stroke="#d8cbb6" stroke-width="1"/></g>
<g><circle cx="91" cy="771" r="20" fill="url(#seal)"/><text x="91" y="779" text-anchor="middle" fill="#fffaf0" font-size="17" font-weight="700" font-family="sans-serif">8</text><text x="130" y="779" fill="#302d27" font-size="25" font-family="sans-serif">孩子動物親近你，是值得珍惜的信任</text><path d="M130 797h705" stroke="#d8cbb6" stroke-width="1"/></g>
<g><circle cx="91" cy="828" r="20" fill="url(#seal)"/><text x="91" y="836" text-anchor="middle" fill="#fffaf0" font-size="17" font-weight="700" font-family="sans-serif">9</text><text x="130" y="836" fill="#302d27" font-size="25" font-family="sans-serif">開心讓人更有力量，好運也需準備</text><path d="M130 854h705" stroke="#d8cbb6" stroke-width="1"/></g>
<g><circle cx="91" cy="885" r="20" fill="url(#seal)"/><text x="91" y="893" text-anchor="middle" fill="#fffaf0" font-size="17" font-weight="700" font-family="sans-serif">10</text><text x="130" y="893" fill="#302d27" font-size="25" font-family="sans-serif">步伐穩能添信心，成事仍靠努力</text><path d="M130 911h705" stroke="#d8cbb6" stroke-width="1"/></g>
<g><circle cx="91" cy="942" r="20" fill="url(#seal)"/><text x="91" y="950" text-anchor="middle" fill="#fffaf0" font-size="17" font-weight="700" font-family="sans-serif">11</text><text x="130" y="950" fill="#302d27" font-size="25" font-family="sans-serif">平常心做事，穩步走更踏實</text><path d="M130 968h705" stroke="#d8cbb6" stroke-width="1"/></g>
<g><circle cx="91" cy="999" r="20" fill="url(#seal)"/><text x="91" y="1007" text-anchor="middle" fill="#fffaf0" font-size="17" font-weight="700" font-family="sans-serif">12</text><text x="130" y="1007" fill="#302d27" font-size="25" font-family="sans-serif">少做無謂爭辯，留力溝通重要的事</text><path d="M130 1025h705" stroke="#d8cbb6" stroke-width="1"/></g>
<g><circle cx="91" cy="1056" r="20" fill="url(#seal)"/><text x="91" y="1064" text-anchor="middle" fill="#fffaf0" font-size="17" font-weight="700" font-family="sans-serif">13</text><text x="130" y="1064" fill="#302d27" font-size="25" font-family="sans-serif">經營自己的生活，比羨慕更滿足</text><path d="M130 1082h705" stroke="#d8cbb6" stroke-width="1"/></g>
<g><circle cx="91" cy="1113" r="20" fill="url(#seal)"/><text x="91" y="1121" text-anchor="middle" fill="#fffaf0" font-size="17" font-weight="700" font-family="sans-serif">14</text><text x="130" y="1121" fill="#302d27" font-size="25" font-family="sans-serif">怕失敗時，先做好眼前的一步</text><path d="M130 1139h705" stroke="#d8cbb6" stroke-width="1"/></g>
<g><circle cx="91" cy="1170" r="20" fill="url(#seal)"/><text x="91" y="1178" text-anchor="middle" fill="#fffaf0" font-size="17" font-weight="700" font-family="sans-serif">15</text><text x="130" y="1178" fill="#302d27" font-size="25" font-family="sans-serif">喜鵲報喜是民俗意象，不是預言</text><path d="M130 1196h705" stroke="#d8cbb6" stroke-width="1"/></g>
<g><circle cx="91" cy="1227" r="20" fill="url(#seal)"/><text x="91" y="1235" text-anchor="middle" fill="#fffaf0" font-size="17" font-weight="700" font-family="sans-serif">16</text><text x="130" y="1235" fill="#302d27" font-size="25" font-family="sans-serif">勤奮要有分寸，過勞會傷身</text><path d="M130 1253h705" stroke="#d8cbb6" stroke-width="1"/></g>
<g><circle cx="91" cy="1284" r="20" fill="url(#seal)"/><text x="91" y="1292" text-anchor="middle" fill="#fffaf0" font-size="17" font-weight="700" font-family="sans-serif">17</text><text x="130" y="1292" fill="#302d27" font-size="25" font-family="sans-serif">媽媽的陪伴能安慰，也可尋求專業</text><path d="M130 1310h705" stroke="#d8cbb6" stroke-width="1"/></g>
<g><circle cx="91" cy="1341" r="20" fill="url(#seal)"/><text x="91" y="1349" text-anchor="middle" fill="#fffaf0" font-size="17" font-weight="700" font-family="sans-serif">18</text><text x="130" y="1349" fill="#302d27" font-size="25" font-family="sans-serif">不輕易放棄，也能停下來調整</text><path d="M130 1367h705" stroke="#d8cbb6" stroke-width="1"/></g>
<g><circle cx="91" cy="1398" r="20" fill="url(#seal)"/><text x="91" y="1406" text-anchor="middle" fill="#fffaf0" font-size="17" font-weight="700" font-family="sans-serif">19</text><text x="130" y="1406" fill="#302d27" font-size="25" font-family="sans-serif">幫人創造價值，收入仍看能力與市場</text><path d="M130 1424h705" stroke="#d8cbb6" stroke-width="1"/></g>
<g><circle cx="91" cy="1455" r="20" fill="url(#seal)"/><text x="91" y="1463" text-anchor="middle" fill="#fffaf0" font-size="17" font-weight="700" font-family="sans-serif">20</text><text x="130" y="1463" fill="#302d27" font-size="25" font-family="sans-serif">眉型不決定毅力，能力可以練習</text><path d="M130 1481h705" stroke="#d8cbb6" stroke-width="1"/></g>
<g><circle cx="91" cy="1512" r="20" fill="url(#seal)"/><text x="91" y="1520" text-anchor="middle" fill="#fffaf0" font-size="17" font-weight="700" font-family="sans-serif">21</text><text x="130" y="1520" fill="#302d27" font-size="25" font-family="sans-serif">傷害別人會耗損信任，尊重讓關係長久</text><path d="M130 1538h705" stroke="#d8cbb6" stroke-width="1"/></g>
<g><circle cx="91" cy="1569" r="20" fill="url(#seal)"/><text x="91" y="1577" text-anchor="middle" fill="#fffaf0" font-size="17" font-weight="700" font-family="sans-serif">22</text><text x="130" y="1577" fill="#302d27" font-size="25" font-family="sans-serif">善意本身有價值，不是避災交換</text><path d="M130 1595h705" stroke="#d8cbb6" stroke-width="1"/></g>
<g><circle cx="91" cy="1626" r="20" fill="url(#seal)"/><text x="91" y="1634" text-anchor="middle" fill="#fffaf0" font-size="17" font-weight="700" font-family="sans-serif">23</text><text x="130" y="1634" fill="#302d27" font-size="25" font-family="sans-serif">孝親在關心陪伴，生活要一起經營</text></g>
<path d="M65 1727h770" stroke="#bfae92" stroke-width="2"/>
<text x="65" y="1785" fill="#7e2d27" font-size="25" font-weight="600" font-family="sans-serif">傳統提供觀照，選擇仍在自己。</text>
<text x="65" y="1835" fill="#827968" font-size="20" font-family="sans-serif">把玄學當提醒，把日子過踏實。</text>
</svg>