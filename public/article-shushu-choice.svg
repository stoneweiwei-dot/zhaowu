    <path d="M0-18 C-28 32 -25 86 0 132 C25 86 28 32 0-18Z" fill="#193d36"/>
  </g>

  <g fill="#a83226" opacity=".12">
    <text x="62" y="150" font-family="serif" font-size="54">STONE 原創</text>
    <text x="510" y="1510" font-family="serif" font-size="54">STONE 原創</text>
  </g>

  <g transform="translate(675 1248)">
    <rect x="-72" y="-72" width="144" height="144" rx="14" fill="#a83226" opacity=".95"/>
    <text x="0" y="-4" text-anchor="middle" font-family="serif" font-size="36" fill="#f6f0df">自</text>
    <text x="0" y="42" text-anchor="middle" font-family="serif" font-size="36" fill="#f6f0df">決</text>
  </g>
</svg>
