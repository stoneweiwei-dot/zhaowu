<text x="86" y="125" font-size="34" letter-spacing="5" fill="#746852">昭梧觀象  ·  九重天外，無人掌燈</text>
<path d="M85 160 H318" stroke="#b8a676" stroke-width="2.5"/>
<text x="82" y="242" font-size="71" font-weight="600" letter-spacing="5">無人掌燈</text>
<text x="85" y="308" font-size="39" fill="#766d61">不再緊握，才真正看見火。</text>
<text x="88" y="1570" font-size="35" letter-spacing="6" fill="#947852">第 四 境 · 佛學意象</text>
<text x="85" y="1640" font-size="45" fill="#3a4742">沒有永恆不變的掌燈者。</text><text x="85" y="1705" font-size="45" fill="#3a4742">放下對永恆不變的執取，</text><text x="85" y="1770" font-size="45" fill="#3a4742">改變與解脫才有可能。</text>
</g><text x="976" y="1860" text-anchor="end" font-family="Noto Serif CJK TC,serif" font-size="33" letter-spacing="5" fill="#655d50">STONE 原創</text></svg>