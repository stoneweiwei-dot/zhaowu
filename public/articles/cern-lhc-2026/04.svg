<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" role="img" aria-labelledby="title desc"><title id="title">陰謀敘事怎麼形成？</title><desc id="desc">從未知科技到「驚人祕密」的心理鏈條。複雜科技｜陌生又難以理解。符號與巧合｜擺拍、神像、時間線。故事合成｜把相關誤當因果</desc><defs><linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fbfaf5"/><stop offset="1" stop-color="#f5f0e7"/></linearGradient></defs><rect width="900" height="1600" fill="url(#p)"/><path d="M58 70H842" stroke="#c09b59" stroke-width="5"/><text x="78" y="155" fill="#183a46" font-size="68" font-weight="700">陰謀敘事</text><text x="78" y="234" fill="#b58741" font-size="68" font-weight="700">怎麼形成？</text><text x="80" y="315" font-size="32" fill="#596d6b">從未知科技到「驚人祕密」的心理鏈條</text><rect x="58" y="355" width="784" height="450" rx="22" fill="#f9f8f3" stroke="#d9d4c4" stroke-width="3"/><rect x="210" y="380" width="480" height="62" rx="16" fill="#e0eded" stroke="#c1b99e"/><text x="450" y="422" text-anchor="middle" font-size="31" font-weight="600" fill="#204e59">科技複雜</text><path d="M450 445v20" stroke="#ba9250" stroke-width="5"/><rect x="240" y="462" width="420" height="62" rx="16" fill="#f0e5d1" stroke="#c1b99e"/><text x="450" y="504" text-anchor="middle" font-size="31" font-weight="600" fill="#204e59">大眾難理解</text><path d="M450 527v20" stroke="#ba9250" stroke-width="5"/><rect x="270" y="544" width="360" height="62" rx="16" fill="#e0eded" stroke="#c1b99e"/><text x="450" y="586" text-anchor="middle" font-size="31" font-weight="600" fill="#204e59">神祕符號</text><path d="M450 609v20" stroke="#ba9250" stroke-width="5"/><rect x="300" y="626" width="300" height="62" rx="16" fill="#f0e5d1" stroke="#c1b99e"/><text x="450" y="668" text-anchor="middle" font-size="31" font-weight="600" fill="#204e59">巧合串聯</text><path d="M450 691v20" stroke="#ba9250" stroke-width="5"/><rect x="330" y="708" width="240" height="62" rx="16" fill="#e0eded" stroke="#c1b99e"/><text x="450" y="750" text-anchor="middle" font-size="31" font-weight="600" fill="#204e59">完整故事</text><rect x="65" y="860" width="770" height="107" rx="18" fill="#edf2ee" stroke="#d7d2c7"/><text x="103" y="923" fill="#214b56" font-size="34" font-weight="600">複雜科技｜陌生又難以理解</text><rect x="65" y="988" width="770" height="107" rx="18" fill="#f0eadf" stroke="#d7d2c7"/><text x="103" y="1051" fill="#214b56" font-size="34" font-weight="600">符號與巧合｜擺拍、神像、時間線</text><rect x="65" y="1116" width="770" height="107" rx="18" fill="#edf2ee" stroke="#d7d2c7"/><text x="103" y="1179" fill="#214b56" font-size="34" font-weight="600">故事合成｜把相關誤當因果</text><rect x="58" y="1290" width="784" height="188" rx="20" fill="#214b55"/><text x="90" y="1370" font-size="30" fill="#eed9ae">有說服力的故事，不一定有可信證據</text><text x="70" y="1540" font-size="26" fill="#867b68">04 / CERN · LHC 科學與想像</text><text x="835" y="1540" font-size="25" fill="#867b68" text-anchor="end">STONE 原創</text></svg>