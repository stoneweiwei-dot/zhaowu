<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" role="img" aria-labelledby="title desc"><title id="title">2016 年影片究竟證明什麼？</title><desc id="desc">黑袍「獻祭」影片在園區擺拍。事實｜影片曾在 CERN 園區拍攝。官方回應｜未經授權，已展開調查。界線｜詭異影像不等於真實祭祀</desc><defs><linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fbfaf5"/><stop offset="1" stop-color="#f5f0e7"/></linearGradient></defs><rect width="900" height="1600" fill="url(#p)"/><path d="M58 70H842" stroke="#c09b59" stroke-width="5"/><text x="78" y="155" fill="#183a46" font-size="68" font-weight="700">2016 年影片</text><text x="78" y="234" fill="#b58741" font-size="68" font-weight="700">究竟證明什麼？</text><text x="80" y="315" font-size="32" fill="#596d6b">黑袍「獻祭」影片在園區擺拍</text><rect x="58" y="355" width="784" height="450" rx="22" fill="#f9f8f3" stroke="#d9d4c4" stroke-width="3"/><rect x="185" y="375" width="530" height="420" rx="28" fill="#e6ebe9" stroke="#aabcb5"/><path d="M255 645Q300 435 345 645Z M385 645Q450 390 515 645Z M555 645Q600 450 645 645Z" fill="#3c545a"/><circle cx="300" cy="500" r="27" fill="#1d5d6d"/><circle cx="450" cy="470" r="36" fill="#1d5d6d"/><circle cx="600" cy="515" r="26" fill="#1d5d6d"/><rect x="220" y="665" width="460" height="65" fill="#f9f4ea" rx="8"/><text x="450" y="710" font-size="32" text-anchor="middle" fill="#7c4b42">DRAMATIZATION · NOT EVIDENCE</text><rect x="65" y="860" width="770" height="107" rx="18" fill="#edf2ee" stroke="#d7d2c7"/><text x="103" y="923" fill="#214b56" font-size="31" font-weight="600"><tspan x="103" dy="0">事實｜影片曾在 CERN 園區拍攝</tspan></text><rect x="65" y="988" width="770" height="107" rx="18" fill="#f0eadf" stroke="#d7d2c7"/><text x="103" y="1051" fill="#214b56" font-size="31" font-weight="600"><tspan x="103" dy="0">官方回應｜未經授權，已展開調查</tspan></text><rect x="65" y="1116" width="770" height="107" rx="18" fill="#edf2ee" stroke="#d7d2c7"/><text x="103" y="1179" fill="#214b56" font-size="31" font-weight="600"><tspan x="103" dy="0">界線｜詭異影像不等於真實祭祀</tspan></text><rect x="58" y="1290" width="784" height="188" rx="20" fill="#214b55"/><text x="90" y="1370" font-size="30" fill="#eed9ae">這是示意插畫，並非 2016 年原始影像</text><text x="70" y="1540" font-size="26" fill="#867b68">03 / CERN · LHC 科學與想像</text><text x="835" y="1540" font-size="25" fill="#867b68" text-anchor="end">STONE 原創</text></svg>