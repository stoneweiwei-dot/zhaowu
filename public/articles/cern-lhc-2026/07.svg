<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" role="img" aria-labelledby="title desc"><title id="title">把時間線排開就能看清脈絡</title><desc id="desc">相繼發生，不等於互相造成。2016｜神祕儀式擺拍影片傳播。2018–2020｜長期停機與疫情的不同脈絡。2026–2030｜第三次長期升級計畫</desc><defs><linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fbfaf5"/><stop offset="1" stop-color="#f5f0e7"/></linearGradient></defs><rect width="900" height="1600" fill="url(#p)"/><path d="M58 70H842" stroke="#c09b59" stroke-width="5"/><text x="78" y="155" fill="#183a46" font-size="68" font-weight="700">把時間線排開</text><text x="78" y="234" fill="#b58741" font-size="68" font-weight="700">就能看清脈絡</text><text x="80" y="315" font-size="32" fill="#596d6b">相繼發生，不等於互相造成</text><rect x="58" y="355" width="784" height="450" rx="22" fill="#f9f8f3" stroke="#d9d4c4" stroke-width="3"/><path d="M175 470H725" stroke="#b79556" stroke-width="12" stroke-linecap="round"/><circle cx="190" cy="470" r="20" fill="#22626b"/><text x="190" y="420" font-size="32" text-anchor="middle" font-weight="700" fill="#1e5663">2016</text><circle cx="322" cy="470" r="20" fill="#22626b"/><text x="322" y="535" font-size="32" text-anchor="middle" font-weight="700" fill="#1e5663">2018</text><circle cx="454" cy="470" r="20" fill="#a25952"/><text x="454" y="420" font-size="32" text-anchor="middle" font-weight="700" fill="#1e5663">2020</text><circle cx="586" cy="470" r="20" fill="#22626b"/><text x="586" y="535" font-size="32" text-anchor="middle" font-weight="700" fill="#1e5663">2026</text><circle cx="718" cy="470" r="20" fill="#22626b"/><text x="718" y="420" font-size="32" text-anchor="middle" font-weight="700" fill="#1e5663">2030</text><path d="M225 645h450" stroke="#c2b690" stroke-dasharray="12 12" stroke-width="6"/><text x="450" y="718" font-size="40" text-anchor="middle" fill="#775b3a">先後 ≠ 因果</text><rect x="65" y="860" width="770" height="107" rx="18" fill="#edf2ee" stroke="#d7d2c7"/><text x="103" y="923" fill="#214b56" font-size="31" font-weight="600"><tspan x="103" dy="0">2016｜神祕儀式擺拍影片傳播</tspan></text><rect x="65" y="988" width="770" height="107" rx="18" fill="#f0eadf" stroke="#d7d2c7"/><text x="103" y="1032" fill="#214b56" font-size="29" font-weight="600"><tspan x="103" dy="0">2018–2020｜長期停機與疫情的不同脈</tspan><tspan x="103" dy="40">絡</tspan></text><rect x="65" y="1116" width="770" height="107" rx="18" fill="#edf2ee" stroke="#d7d2c7"/><text x="103" y="1179" fill="#214b56" font-size="31" font-weight="600"><tspan x="103" dy="0">2026–2030｜第三次長期升級計畫</tspan></text><rect x="58" y="1290" width="784" height="188" rx="20" fill="#214b55"/><text x="90" y="1370" font-size="30" fill="#eed9ae">先後順序不是因果關係的證據</text><text x="70" y="1540" font-size="26" fill="#867b68">07 / CERN · LHC 科學與想像</text><text x="835" y="1540" font-size="25" fill="#867b68" text-anchor="end">STONE 原創</text></svg>