<text x="86" y="125" font-size="34" letter-spacing="5" fill="#746852">昭梧觀象  ·  九重天外，無人掌燈</text>
<path d="M85 160 H318" stroke="#b8a676" stroke-width="2.5"/>
<text x="82" y="242" font-size="71" font-weight="600" letter-spacing="5">黑焰與白燈</text>
<text x="85" y="308" font-size="39" fill="#766d61">承接，不等於永遠重複。</text>
<text x="88" y="1570" font-size="35" letter-spacing="6" fill="#947852">第 二 境 · 佛學意象</text>
<text x="85" y="1640" font-size="45" fill="#3a4742">有行為的延續，沒有固定的判詞。</text><text x="85" y="1705" font-size="45" fill="#3a4742">善惡業果並非神明的賞罰帳簿。</text><text x="85" y="1770" font-size="45" fill="#3a4742">不能因受苦，就推定曾經作惡。</text>
</g><text x="976" y="1860" text-anchor="end" font-family="Noto Serif CJK TC,serif" font-size="33" letter-spacing="5" fill="#655d50">STONE 原創</text></svg>