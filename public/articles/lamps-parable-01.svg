<text x="86" y="125" font-size="34" letter-spacing="5" fill="#746852">昭梧觀象  ·  九重天外，無人掌燈</text>
<path d="M85 160 H318" stroke="#b8a676" stroke-width="2.5"/>
<text x="82" y="242" font-size="71" font-weight="600" letter-spacing="5">青燈相續</text>
<text x="85" y="308" font-size="39" fill="#766d61">前一盞已滅，後一盞為何而生？</text>
<text x="88" y="1570" font-size="35" letter-spacing="6" fill="#947852">第 一 境 · 佛學意象</text>
<text x="85" y="1640" font-size="45" fill="#3a4742">不是同一團火，亦非毫無關聯。</text><text x="85" y="1705" font-size="45" fill="#3a4742">後起之果，依先前條件而生。</text><text x="85" y="1770" font-size="45" fill="#3a4742">無人見過舊火去往何處。</text>
</g><text x="976" y="1860" text-anchor="end" font-family="Noto Serif CJK TC,serif" font-size="33" letter-spacing="5" fill="#655d50">STONE 原創</text></svg>