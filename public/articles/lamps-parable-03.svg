<text x="86" y="125" font-size="34" letter-spacing="5" fill="#746852">昭梧觀象  ·  九重天外，無人掌燈</text>
<path d="M85 160 H318" stroke="#b8a676" stroke-width="2.5"/>
<text x="82" y="242" font-size="71" font-weight="600" letter-spacing="5">風與燈芯</text>
<text x="85" y="308" font-size="39" fill="#766d61">一盞燈，為何忽明忽暗？</text>
<text x="88" y="1570" font-size="35" letter-spacing="6" fill="#947852">第 三 境 · 佛學意象</text>
<text x="85" y="1640" font-size="45" fill="#3a4742">風、油、燈芯與照料，皆為因緣。</text><text x="85" y="1705" font-size="45" fill="#3a4742">風停之後，火光仍會變。</text><text x="85" y="1770" font-size="45" fill="#3a4742">只找一個原因，便看不見全貌。</text>
